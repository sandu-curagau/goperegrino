<ion-app>
  <div class="presentation">
    <header class="intro">
      <img class="brand-logo" src="logo.png" alt="GoPeregrino" width="72" height="72" />
      <p class="eyebrow">{{ locale.t('prototype') }}</p>
      <h2>{{ locale.t('introTitle').slice(0, -1) }}<span>.</span></h2>
      <p class="intro-copy">{{ locale.t('introCopy') }}</p>
    </header>

    <div class="phone">
      <div class="phone-screen">
        <div class="status-bar" aria-hidden="true">
          <span>9:41</span>
          <span class="status-island"></span>
          <span class="status-icons">
            <ion-icon name="cellular"></ion-icon>
            <ion-icon name="wifi"></ion-icon>
            <ion-icon name="battery-full"></ion-icon>
          </span>
        </div>

        <ion-tabs [inert]="!store.state().started">
          <ion-tab-bar slot="bottom">
            @for (tab of tabs; track tab.path) {
              <ion-tab-button [tab]="tab.path">
                <span class="tab-icon">
                  <ion-icon [name]="tab.icon" aria-hidden="true"></ion-icon>
                </span>
                <ion-label>{{ locale.t(tab.path) }}</ion-label>
              </ion-tab-button>
            }
          </ion-tab-bar>
        </ion-tabs>

        @if (!store.state().started) {
          <app-onboarding />
        }

        @if (store.started()) {
          <button
            type="button"
            class="open-panel"
            [attr.aria-label]="locale.t('demo')"
            aria-haspopup="dialog"
            (click)="demoPanel.showModal()"
          >
            <ion-icon name="options-outline" aria-hidden="true"></ion-icon>
          </button>
        }
        <div class="home-indicator" aria-hidden="true"></div>
      </div>
    </div>

    <aside class="demo-panel" aria-labelledby="demo-title">
      <div class="panel-heading">
        <span class="panel-icon"
          ><ion-icon name="options-outline" aria-hidden="true"></ion-icon
        ></span>
        <h2 id="demo-title">{{ locale.t('demo') }}</h2>
      </div>
      <app-demo-controls />
    </aside>
  </div>

  <dialog #demoPanel class="mobile-panel" aria-labelledby="mobile-demo-title">
    <form method="dialog">
      <span class="panel-icon"
        ><ion-icon name="options-outline" aria-hidden="true"></ion-icon
      ></span>
      <h2 id="mobile-demo-title">{{ locale.t('demo') }}</h2>
      <button type="submit" class="close-panel" [attr.aria-label]="locale.t('close')">
        <ion-icon name="close-outline" aria-hidden="true"></ion-icon>
      </button>
    </form>
    <app-demo-controls />
  </dialog>
</ion-app>
